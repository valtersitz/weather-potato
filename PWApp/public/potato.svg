<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background (for maskable icon safe zone) -->
  <circle cx="50" cy="50" r="50" fill="#FF6B6B"/>

  <!-- Potato body -->
  <ellipse cx="50" cy="56" rx="30" ry="26" fill="#D4A574"/>

  <!-- Potato spots -->
  <ellipse cx="36" cy="52" rx="4" ry="5.5" fill="#B8936A"/>
  <ellipse cx="54" cy="50" rx="3.5" ry="5" fill="#B8936A"/>
  <ellipse cx="46" cy="67" rx="5" ry="4" fill="#B8936A"/>
  <ellipse cx="61" cy="62" rx="2.5" ry="3.5" fill="#B8936A"/>

  <!-- Sunglasses: left lens -->
  <rect x="28" y="47" width="16" height="10" rx="3" fill="#1a1a1a"/>
  <!-- Sunglasses: right lens -->
  <rect x="56" y="47" width="16" height="10" rx="3" fill="#1a1a1a"/>
  <!-- Sunglasses: bridge -->
  <rect x="44" y="50" width="12" height="2.5" rx="1.2" fill="#1a1a1a"/>
  <!-- Sunglasses: left arm -->
  <rect x="20" y="49" width="8" height="2.5" rx="1.2" fill="#1a1a1a"/>
  <!-- Sunglasses: right arm -->
  <rect x="72" y="49" width="8" height="2.5" rx="1.2" fill="#1a1a1a"/>

  <!-- Smirk (left corner up, right corner down = cocky smirk) -->
  <path d="M 38 64 Q 47 70 57 66" stroke="#7a5c3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
</svg>
